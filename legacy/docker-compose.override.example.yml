# Copy to docker-compose.override.yml for live editing without image rebuilds:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   docker compose up -d --build
#
# Compose merges this file automatically with docker-compose.yml.
#
# Reload after edits:
#   touch data/restart.txt
# or rely on EMCP_AUTO_RELOAD (polls servers/lib/views every second).

services:
  emcp:
    environment:
      EMCP_AUTO_RELOAD: "1"
      EMCP_RESTART_MARKER: /app/data/restart.txt
    volumes:
      - ./servers:/app/servers
      - ./lib:/app/lib
      - ./views:/app/views
      - ./server.rb:/app/server.rb
      - ./config.ru:/app/config.ru
      - ./scripts:/app/scripts:ro
    command: ["/app/scripts/run-with-reload.sh"]
