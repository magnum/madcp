services:
  emcp:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${EMCP_HOST_PORT:-8765}:8765"
    volumes:
      # All durable EMCP state on the host under ./data
      - ./data:/app/data
      - ./logs:/app/logs
      - ./data/cli/basecamp:/home/emcp/.config/basecamp
      - ./data/cli/basecamp-cache:/home/emcp/.cache/basecamp
      - ./data/cli/hey:/home/emcp/.config/hey-cli
      - ./data/cli/gws:/home/emcp/.config/gws
